# AI Weekly Radar — 每日大佬发言采集
# 每天 21:30 CST 采集 follow-builders feed，提交到仓库供周五汇总使用
# 见 SPEC.md「大佬之声」

name: daily-voices

on:
  schedule:
    # 每天 21:30 CST = UTC 13:30
    - cron: "30 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reject stale checkout
        run: |
          git fetch origin main
          AHEAD=$(git rev-list --count HEAD..origin/main)
          if [ "$AHEAD" != "0" ]; then
            echo "::error::本次 run checkout 的是 $(git rev-parse --short HEAD)，落后 origin/main $AHEAD 个 commit。请 cancel 所有 queued run 后重触发。"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect daily voices
        run: python3 -m collector voices

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/voices/daily/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "daily: voices $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || { echo "rebase 冲突，放弃 push"; exit 1; }
          git push
