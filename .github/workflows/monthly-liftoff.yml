# AI Weekly Radar — 每月起飞追踪（star 增长快照）
# 每月 1 日 20:30 CST 回访历史高分项目的 star 增长
# 见 SPEC.md「起飞追踪」

name: monthly-liftoff

on:
  schedule:
    # 每月 1 日 20:30 CST = UTC 12:30
    - cron: "30 12 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  liftoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Reject stale checkout
        run: |
          git fetch origin main
          AHEAD=$(git rev-list --count HEAD..origin/main)
          if [ "$AHEAD" != "0" ]; then
            echo "::error::本次 run checkout 的是 $(git rev-parse --short HEAD)，落后 origin/main $AHEAD 个 commit。请 cancel 所有 queued run 后重触发。"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Track stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m collector track

      - name: Regenerate site
        run: python3 -m collector report

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "monthly: liftoff tracking"
          git pull --rebase origin main || { echo "rebase 冲突，放弃 push"; exit 1; }
          git push
