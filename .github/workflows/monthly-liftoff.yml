# AI Weekly Radar — 每月起飞追踪（star 增长快照）
# 每月 1 日 20:30 CST 回访历史高分项目的 star 增长
# 见 SPEC.md「起飞追踪」

name: monthly-liftoff

on:
  schedule:
    # 每月 1 日 20:30 CST = UTC 12:30
    - cron: "30 12 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  liftoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Track stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m collector track

      - name: Regenerate site
        run: python3 -m collector report

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "monthly: liftoff tracking"
          git push
