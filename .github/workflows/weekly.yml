# AI Weekly Radar — 每周五自动收集 + 百炼 API 评分 + 发布
# 见 SPEC.md「GitHub Actions 自动化」

name: weekly

on:
  schedule:
    # 每周五 20:00 CST = UTC 12:00
    - cron: "0 12 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show commit (debug)
        run: |
          echo "=== weekly workflow running on commit $(git rev-parse HEAD) ==="
          git log -1 --pretty='%h %s'

      - name: Reject stale checkout
        # workflow_dispatch 会把"被触发那一刻的 HEAD"钉死给这次 run。
        # 如果用户在 push 新 commit 之前点了 Run workflow，或者 queue 里
        # 还有旧 dispatch 没 cancel，这次 run 就会跑旧代码，浪费 7 分钟
        # LLM API 时间后才在某个已修复的 bug 上挂掉。
        # 这里硬性 fail：落后 origin/main 任何 commit 都直接退出，
        # 让用户 cancel 后重触发，避免再次"修了还是挂"的猜谜。
        run: |
          git fetch origin main
          AHEAD=$(git rev-list --count HEAD..origin/main)
          if [ "$AHEAD" != "0" ]; then
            echo "::error::本次 run checkout 的是 $(git rev-parse --short HEAD)，但 origin/main 已经是 $(git rev-parse --short origin/main)，落后 $AHEAD 个 commit。"
            echo "::error::这通常意味着：(1) 你在 push 最新修复之前点了 Run workflow；或 (2) Actions 列表里还有更早的 queued dispatch 没 cancel。"
            echo "::error::请去 Actions 页 cancel 掉所有 Queued / In progress 的 weekly run，等列表清空后再点 Run workflow。"
            exit 1
          fi
          echo "✓ HEAD == origin/main，跑的是最新代码。"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect candidates
        run: python3 -m collector collect

      - name: Score with DashScope API
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          WEEK=$(python3 -c "from collector.schema import week_of; import datetime; print(week_of(datetime.date.today()))")
          echo "WEEK=$WEEK" >> "$GITHUB_ENV"
          python3 -m collector score "$WEEK"

      - name: Voices summary (skip if no daily data)
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: python3 -m collector voices-sum "$WEEK" || true

      - name: Validate
        run: python3 -m collector validate "$WEEK"

      - name: Generate site
        run: python3 -m collector report

      - name: Feishu push
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python3 -m collector feishu "$WEEK"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "weekly: $WEEK
          Co-Authored-By: Claude <noreply@anthropic.com>"
          # 并发 push 兜底：别的 workflow run / 手动 push 可能让远端超前，
          # 直接 push 会被拒（fetch first）。rebase 把本地 commit 接到最新远端上再推。
          git pull --rebase origin main || { echo "rebase 冲突，放弃 push"; exit 1; }
          git push
